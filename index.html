<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07061a">
  <meta name="referrer" content="no-referrer">
  <title>Football Scoreboard</title>
  <meta name="description" content="An ad-free live scoreboard for the NFL and FBS college football.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Football">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://site.api.espn.com" crossorigin>
  <link rel="preconnect" href="https://a.espncdn.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <div class="comet" aria-hidden="true">
    <div class="comet-fly">
    <span class="comet-trail"></span>
    <svg class="comet-ball" viewBox="0 0 120 70" aria-hidden="true">
      <path d="M4 35C28 1 92 1 116 35C92 69 28 69 4 35Z" fill="currentColor"/>
      <path d="M38 35h44M48 29v12M56 29v12M64 29v12M72 29v12" stroke="#07061a" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
      <path d="M22 18q-6 17 0 34M98 18q6 17 0 34" stroke="#07061a" stroke-width="3" fill="none" opacity=".35"/>
    </svg>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="#/scores">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-35 16 16)"><path d="M2 16C8 6 24 6 30 16C24 26 8 26 2 16Z" fill="#8a4b2a"/><path d="M2 16C8 6 24 6 30 16C24 26 8 26 2 16Z" fill="none" stroke="#f3d9b5" stroke-opacity=".35" stroke-width="1"/><path d="M11 16h10M13 14v4M16 14v4M19 14v4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><path d="M6.5 11.5q-1.5 4.5 0 9M25.5 11.5q1.5 4.5 0 9" stroke="#fff" stroke-width="1.2" fill="none" opacity=".85"/></g></svg>
        <span>Football Scoreboard</span>
      </a>
      <div class="league-toggle" role="group" aria-label="League">
        <button type="button" data-league="nfl">NFL</button>
        <button type="button" data-league="cfb">CFB</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/scores" data-tab="scores">Scores</a>
      <a href="#/standings" data-tab="standings">Standings</a>
      <a href="#/poll" data-tab="poll" data-cfb-only>AP Poll</a>
      <a href="#/my" data-tab="my" class="tab-my">★ My Teams</a>
    </nav>
    <div class="chips" id="chips" hidden></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    Scores, standings and logos from ESPN's public data. No ads, no tracking.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
